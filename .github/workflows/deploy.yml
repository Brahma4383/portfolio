# Builds the site, tests it and publishes it on GitHub Pages every time main is
# pushed. If a test fails, nothing is published and the live site stays as it was.
# (Settings → Pages → Source must be set to "GitHub Actions".)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run that has started is left to finish (stopping a
# deployment halfway is unsafe); a newer push replaces any run still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds the site into dist/, serves it, and runs the @smoke tests against it
      # in the runner's Google Chrome (see playwright.config.js).
      - name: Build and run the smoke tests
        run: npm run test:smoke
      - name: Keep the test report if a test failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      # publish exactly the build the tests just checked
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
